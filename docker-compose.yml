services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: orders_stock_django
      POSTGRES_USER: orders_stock
      POSTGRES_PASSWORD: orders_stock
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_stock -d orders_stock_django"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "local-only-secret-key"
      DATABASE_NAME: orders_stock_django
      DATABASE_USER: orders_stock
      DATABASE_PASSWORD: orders_stock
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
